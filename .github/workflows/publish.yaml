name: Release RHvdo

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rhvdo-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate next release version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          mapfile -t RELEASE_TAGS < <(
            git tag --list |
              awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' |
              sort -V
          )

          RELEASE_COUNT="${#RELEASE_TAGS[@]}"
          LATEST_TAG=""
          if (( RELEASE_COUNT > 0 )); then
            LATEST_TAG="${RELEASE_TAGS[$((RELEASE_COUNT - 1))]}"
          fi

          if [[ -z "$LATEST_TAG" ]]; then
            VERSION_NAME="1.0.0"
            VERSION_CODE=1
          else
            VERSION_NAME="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
            PATCH=$((PATCH + 1))
            VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
            VERSION_CODE=$((RELEASE_COUNT + 1))
          fi

          RELEASE_TAG="v${VERSION_NAME}"

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

          echo "Next release: $RELEASE_TAG"
          echo "versionName: $VERSION_NAME"
          echo "versionCode: $VERSION_CODE"

      - name: Ensure release tag does not already exist
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Decode release keystore
        uses: timheuer/base64-to-file@v2
        id: keystore
        with:
          fileName: rhvdo-release.jks
          encodedString: ${{ secrets.KEYSTORE }}

      - name: Build signed release APKs and AAB
        shell: bash
        env:
          KEYSTORE: ${{ steps.keystore.outputs.filePath }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew clean assembleRelease bundleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE" \
            -Pandroid.injected.signing.store.file="$KEYSTORE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Locate release APK
        shell: bash
        run: |
          set -euo pipefail
          OUT="app/build/outputs/apk/release"

          echo "APK outputs:"
          find "$OUT" -maxdepth 1 -type f -name '*.apk' -print | sort || true

          VERIFY_APK=""
          if [[ -f "$OUT/app-universal-release.apk" ]]; then
            VERIFY_APK="$OUT/app-universal-release.apk"
          elif [[ -f "$OUT/app-release.apk" ]]; then
            VERIFY_APK="$OUT/app-release.apk"
          else
            VERIFY_APK="$(find "$OUT" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1 || true)"
          fi

          if [[ -z "$VERIFY_APK" || ! -f "$VERIFY_APK" ]]; then
            echo "::error::No release APK was produced. Full APK output directory:"
            find app/build/outputs/apk -maxdepth 3 -type f -print || true
            exit 1
          fi

          echo "VERIFY_APK=$VERIFY_APK" >> "$GITHUB_ENV"
          echo "Selected APK for verification: $VERIFY_APK"

      - name: Verify APK identity and version
        shell: bash
        run: |
          set -euo pipefail
          APK="$VERIFY_APK"

          # Use Android SDK Build Tools instead of apkanalyzer.
          # GitHub-hosted runners provide aapt/aapt2 with the installed build tools.
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT="$BUILD_TOOLS/aapt"
          if [[ ! -x "$AAPT" ]]; then
            AAPT="$BUILD_TOOLS/aapt2"
          fi

          if [[ ! -x "$AAPT" ]]; then
            echo "::error::Neither aapt nor aapt2 was found in $BUILD_TOOLS"
            find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f \( -name aapt -o -name aapt2 \) -print || true
            exit 1
          fi

          echo "Build tools: $BUILD_TOOLS"
          echo "APK inspection tool: $AAPT"
          echo "APK: $APK"

          BADGING="$($AAPT dump badging "$APK")"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | awk '/^package:/{print; exit}')"

          if [[ -z "$PACKAGE_LINE" ]]; then
            echo "::error::Could not read package metadata from the release APK."
            exit 1
          fi

          ACTUAL_APPLICATION_ID="$(printf '%s\n' "$PACKAGE_LINE" | sed -n "s/.*name='\([^']*\)'.*/\1/p")"
          ACTUAL_VERSION_CODE="$(printf '%s\n' "$PACKAGE_LINE" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          ACTUAL_VERSION_NAME="$(printf '%s\n' "$PACKAGE_LINE" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"

          echo "APK applicationId: $ACTUAL_APPLICATION_ID"
          echo "Expected applicationId: io.github.faroffcode.rhvdo"
          echo "APK versionName: $ACTUAL_VERSION_NAME"
          echo "Expected versionName: $VERSION_NAME"
          echo "APK versionCode: $ACTUAL_VERSION_CODE"
          echo "Expected versionCode: $VERSION_CODE"

          if [[ "$ACTUAL_APPLICATION_ID" != "io.github.faroffcode.rhvdo" ]]; then
            echo "::error::APK applicationId mismatch."
            exit 1
          fi

          if [[ "$ACTUAL_VERSION_NAME" != "$VERSION_NAME" ]]; then
            echo "::error::APK versionName mismatch."
            exit 1
          fi

          if [[ "$ACTUAL_VERSION_CODE" != "$VERSION_CODE" ]]; then
            echo "::error::APK versionCode mismatch."
            exit 1
          fi

          echo "APK verification passed."

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail
          OUT="app/build/outputs/apk/release"
          RELEASE_DIR="release-assets"
          mkdir -p "$RELEASE_DIR"

          shopt -s nullglob
          APKS=("$OUT"/*.apk)
          if (( ${#APKS[@]} == 0 )); then
            echo "::error::No APK files found for release packaging."
            exit 1
          fi

          for SRC in "${APKS[@]}"; do
            BASE="$(basename "$SRC" .apk)"
            LABEL="${BASE#app-}"
            LABEL="${LABEL%-release}"
            if [[ "$LABEL" == "release" || -z "$LABEL" ]]; then
              LABEL="universal"
            fi

            DEST="$RELEASE_DIR/RHvdo-v${VERSION_NAME}-${LABEL}.apk"
            echo "Copying $SRC -> $DEST"
            cp "$SRC" "$DEST"
          done

          AAB="app/build/outputs/bundle/release/app-release.aab"
          if [[ ! -f "$AAB" ]]; then
            echo "::error::Expected release AAB was not produced: $AAB"
            find app/build/outputs/bundle -maxdepth 3 -type f -print || true
            exit 1
          fi

          cp "$AAB" "$RELEASE_DIR/RHvdo-v${VERSION_NAME}.aab"

          (cd "$RELEASE_DIR" && sha256sum * > SHA256SUMS)
          cat "$RELEASE_DIR/SHA256SUMS"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ env.RELEASE_TAG }}"
          target_commitish: "${{ github.sha }}"
          name: "RHvdo ${{ env.RELEASE_TAG }}"
          generate_release_notes: true
          files: release-assets/*
